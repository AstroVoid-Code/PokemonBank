
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank | Consulta de Saldo</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/operaciones.css">

    <!-- DATOS Y CONTROL DE SESIÓN -->
    <script src="js/datos.js"></script>

    <script>
        verificarSesion();
    </script>

</head>

<body>

    <div class="operation-container">

        <!-- ENCABEZADO -->
        <header class="operation-header">

            <a href="menu.html" class="back-link">
                ← Volver
            </a>

            <h1>Pokémon Bank</h1>

        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="operation-content">

            <div class="operation-title">

                <div class="operation-symbol">
                    $
                </div>

                <h2>Saldo disponible</h2>

                <p>
                    Consulta el saldo actual de tu cuenta.
                </p>

            </div>

            <!-- TARJETA DE SALDO -->
            <div class="balance-card">

                <p>Saldo disponible</p>

                <h2 id="currentBalance">
                    $0.00
                </h2>

                <!-- NÚMERO DE CUENTA DINÁMICO -->
                <span id="accountNumber">
                    Cuenta: Cargando...
                </span>

            </div>

            <!-- VOLVER AL MENÚ -->
            <a
                href="menu.html"
                class="btn-confirm balance-button">

                Volver al menú principal

            </a>

        </main>

    </div>

    <!-- ======================================
         JAVASCRIPT DE POKÉMON BANK
    ======================================= -->

    <!-- Mostrar saldo y número de cuenta -->
    <script src="js/saldo.js"></script>

    <!-- MOSTRAR NÚMERO DE CUENTA -->
    <script>

        if (verificarSesion()) {

            const usuario = obtenerUsuario();

            if (usuario) {

                document.getElementById("accountNumber")
                    .textContent = "Cuenta: " + usuario.cuenta;

            } else {

                cerrarSesion();

            }

        }

    </script>

</body>

</html>
