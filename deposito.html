
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank | Depósito</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/operaciones.css">

    <!-- Verificar sesión antes de mostrar la página -->
    <script src="js/datos.js"></script>
    <script>
        verificarSesion();
    </script>

</head>

<body>

    <div class="operation-container">

        <!-- ENCABEZADO -->
        <header class="operation-header">

            <a href="menu.html" class="back-link">
                ← Volver
            </a>

            <h1>Pokémon Bank</h1>

        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="operation-content">

            <div class="operation-title">

                <div class="operation-symbol">↓</div>

                <h2>Realizar depósito</h2>

                <p>Ingresa el monto que deseas depositar.</p>

            </div>

            <!-- FORMULARIO DE DEPÓSITO -->
            <form id="depositForm">

                <label for="depositAmount">
                    Monto a depositar
                </label>

                <div class="amount-input">

                    <span>$</span>

                    <input
                        type="number"
                        id="depositAmount"
                        min="0.01"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>

                <p class="quick-label">
                    Selecciona un monto rápido
                </p>

                <!-- MONTOS RÁPIDOS -->
                <div class="quick-amounts">

                    <button
                        type="button"
                        class="amount-btn"
                        data-amount="10">
                        $10
                    </button>

                    <button
                        type="button"
                        class="amount-btn"
                        data-amount="20">
                        $20
                    </button>

                    <button
                        type="button"
                        class="amount-btn"
                        data-amount="50">
                        $50
                    </button>

                    <button
                        type="button"
                        class="amount-btn"
                        data-amount="100">
                        $100
                    </button>

                </div>

                <!-- CONFIRMAR OPERACIÓN -->
                <button
                    type="submit"
                    class="btn-confirm">

                    Confirmar depósito

                </button>

            </form>

        </main>

    </div>

    <!-- ======================================
         BIBLIOTECAS JAVASCRIPT
    ======================================= -->

    <!-- SweetAlert: mensajes interactivos -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <!-- jsPDF: generación de comprobantes PDF -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>

    <!-- ======================================
         FUNCIONES DE POKÉMON BANK
    ======================================= -->

    <!-- datos.js ya se cargó en el encabezado -->

    <!-- Operación de depósito -->
    <script src="js/deposito.js"></script>

</body>

</html>
