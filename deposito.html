<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank | Depósito</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/operaciones.css">
</head>

<body>

    <div class="operation-container">

        <header class="operation-header">
            <a href="menu.html" class="back-link">← Volver</a>
            <h1>Pokémon Bank</h1>
        </header>

        <main class="operation-content">

            <div class="operation-title">

                <div class="operation-symbol">↓</div>

                <h2>Realizar depósito</h2>
                <p>Ingresa el monto que deseas depositar.</p>

            </div>

            <form id="depositForm">

                <label for="depositAmount">
                    Monto a depositar
                </label>

                <div class="amount-input">

                    <span>$</span>

                    <input
                        type="number"
                        id="depositAmount"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>

                <p class="quick-label">
                    Selecciona un monto rápido
                </p>

                <div class="quick-amounts">

                    <button
                        type="button"
                        class="amount-btn"
                        data-amount="10">
                        $10
                    </button>

                    <button
                        type="button"
                        class="amount-btn"
                        data-amount="20">
                        $20
                    </button>

                    <button
                        type="button"
                        class="amount-btn"
                        data-amount="50">
                        $50
                    </button>

                    <button
                        type="button"
                        class="amount-btn"
                        data-amount="100">
                        $100
                    </button>

                </div>

                <button
                    type="submit"
                    class="btn-confirm">

                    Confirmar depósito

                </button>

            </form>

        </main>

    </div>


    <!-- SweetAlert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <!-- Datos del banco -->
    <script src="js/datos.js"></script>

    <!-- Depósito -->
    <script src="js/deposito.js"></script>

</body>

</html>
