<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank | ATM</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
    href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="css/styles.css">
</head>

<body>

    <main>
        <h1>Pokémon Bank</h1>

        <h2>Bienvenido</h2>
        <p>Ingresa tu PIN para continuar</p>

        <form id="loginForm">
            <label for="pin">PIN de seguridad</label>

            <input 
                type="password"
                id="pin"
                name="pin"
                maxlength="4"
                placeholder="••••"
                required
            >

            <button type="submit" class="btn btn-primary btn-block">
                Ingresar
            </button>
        </form>

        <p>Tu dinero, siempre a salvo.</p>
    </main>

    <script src="js/login.js"></script>

</body>
</html>
