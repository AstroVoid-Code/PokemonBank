<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank | Pago de Servicios</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/operaciones.css">
</head>

<body>

    <div class="operation-container">

        <header class="operation-header">

            <a href="menu.html" class="back-link">
                ← Volver
            </a>

            <h1>Pokémon Bank</h1>

        </header>

        <main class="operation-content">

            <div class="operation-title">

                <div class="operation-symbol">
                    ⚡
                </div>

                <h2>Pago de servicios</h2>

                <p>Selecciona el servicio que deseas pagar.</p>

            </div>

            <form id="serviceForm">

                <!-- SERVICIO -->
                <label for="serviceType">
                    Tipo de servicio
                </label>

                <select
                    id="serviceType"
                    class="service-select"
                    required
                >

                    <option value="">
                        Selecciona un servicio
                    </option>

                    <option value="Energía eléctrica">
                        ⚡ Energía eléctrica
                    </option>

                    <option value="Internet">
                        🌐 Internet
                    </option>

                    <option value="Telefonía">
                        ☎ Telefonía
                    </option>

                    <option value="Agua potable">
                        💧 Agua potable
                    </option>

                </select>


                <!-- FACTURA -->
                <label for="invoiceNumber">
                    Número de factura
                </label>

                <input
                    type="text"
                    id="invoiceNumber"
                    class="service-input"
                    placeholder="Ejemplo: 458721"
                    required
                >


                <!-- MONTO -->
                <label for="serviceAmount">
                    Monto a pagar
                </label>

                <div class="amount-input">

                    <span>$</span>

                    <input
                        type="number"
                        id="serviceAmount"
                        min="0"
                        step="0.01"
                        placeholder="0.00"
                        required
                    >

                </div>


                <!-- SALDO DISPONIBLE -->
                <div class="available-balance">

                    <span>Saldo disponible</span>

                    <strong id="availableBalance">
                        $0.00
                    </strong>

                </div>


                <button
                    type="submit"
                    class="btn-confirm"
                >
                    Realizar pago
                </button>

            </form>

        </main>

    </div>


    <!-- SweetAlert -->
    <script src="https://unpkg.com/sweetalert/dist/sweetalert.min.js"></script>

    <!-- Datos generales -->
    <script src="js/datos.js"></script>

    <!-- Pago de servicios -->
    <script src="js/servicios.js"></script>

</body>

</html>
