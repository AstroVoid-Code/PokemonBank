<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank | Historial</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- CSS -->
    <link rel="stylesheet" href="css/operaciones.css">
</head>

<body>

    <div class="history-container">

        <header class="operation-header">

            <a href="menu.html" class="back-link">
                ← Volver
            </a>

            <h1>Pokémon Bank</h1>

        </header>

        <main class="history-content">

            <div class="operation-title">

                <div class="operation-symbol">
                    ↔
                </div>

                <h2>Historial de transacciones</h2>

                <p>
                    Consulta los movimientos realizados en tu cuenta.
                </p>

            </div>

            <!-- TABLA -->
            <div class="table-responsive">

                <table class="table history-table">

                    <thead>

                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Tipo</th>
                            <th>Detalle</th>
                            <th>Monto</th>
                        </tr>

                    </thead>

                    <tbody id="historyBody">

                        <!-- JavaScript agregará las transacciones aquí -->

                    </tbody>

                </table>

            </div>

            <!-- Mensaje si no hay movimientos -->
            <div id="emptyHistory" class="empty-history">

                No hay transacciones registradas.

            </div>

            <a href="menu.html"
                class="btn-confirm balance-button">

                Volver al menú principal

            </a>

        </main>

    </div>

    <!-- Datos -->
    <script src="js/datos.js"></script>

    <!-- Historial -->
    <script src="js/historial.js"></script>

</body>

</html>
