
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank | Historial de Transacciones</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/operaciones.css">

    <!-- DATOS GENERALES Y CONTROL DE SESIÓN -->
    <script src="js/datos.js"></script>

    <script>
        // Impedir acceso sin iniciar sesión
        if (sessionStorage.getItem("sesionPokemonBank") !== "activa") {
            window.location.replace("index.html");
        }
    </script>

</head>

<body>

    <div class="history-container">

        <!-- ENCABEZADO -->
        <header class="operation-header">

            <a href="menu.html" class="back-link">
                ← Volver
            </a>

            <h1>Pokémon Bank</h1>

        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="history-content">

            <div class="operation-title">

                <div class="operation-symbol">
                    ↔
                </div>

                <h2>Historial de transacciones</h2>

                <p>
                    Consulta los movimientos realizados en tu cuenta.
                </p>

            </div>

            <!-- TABLA DE TRANSACCIONES -->
            <div class="table-responsive">

                <table class="table history-table">

                    <thead>

                        <tr>
                            <th>Fecha</th>
                            <th>Hora</th>
                            <th>Tipo</th>
                            <th>Detalle</th>
                            <th>Monto</th>
                        </tr>

                    </thead>

                    <tbody id="historyBody">

                        <!-- JavaScript agregará las transacciones aquí -->

                    </tbody>

                </table>

            </div>

            <!-- MENSAJE CUANDO NO HAY MOVIMIENTOS -->
            <div id="emptyHistory" class="empty-history">

                No hay transacciones registradas.

            </div>

            <!-- VOLVER AL MENÚ -->
            <a
                href="menu.html"
                class="btn-confirm balance-button">

                Volver al menú principal

            </a>

        </main>

    </div>

    <!-- ======================================
         JAVASCRIPT DE POKÉMON BANK
    ======================================= -->

    <!-- datos.js ya se cargó en el encabezado -->

    <!-- Mostrar historial de transacciones -->
    <script src="js/historial.js"></script>

</body>

</html>
