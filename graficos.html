
<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank | Gráficos</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- CSS personalizado -->
    <link rel="stylesheet" href="css/operaciones.css">

    <!-- DATOS GENERALES DEL BANCO -->
    <script src="js/datos.js"></script>

    <!-- CONTROL DE SESIÓN -->
    <script>
        // Impedir acceso sin iniciar sesión
        if (sessionStorage.getItem("sesionPokemonBank") !== "activa") {
            window.location.replace("index.html");
        }
    </script>

</head>

<body>

    <div class="chart-container">

        <!-- ENCABEZADO -->
        <header class="operation-header">

            <a href="menu.html" class="back-link">
                ← Volver
            </a>

            <h1>Pokémon Bank</h1>

        </header>

        <!-- CONTENIDO PRINCIPAL -->
        <main class="chart-content">

            <div class="operation-title">

                <div class="operation-symbol">
                    📊
                </div>

                <h2>Gráfico de transacciones</h2>

                <p>
                    Cantidad de movimientos realizados según su tipo.
                </p>

            </div>

            <!-- RESUMEN DE TRANSACCIONES -->
            <div class="transaction-summary">

                <div class="summary-card">

                    <span>Depósitos</span>

                    <strong id="totalDepositos">
                        0
                    </strong>

                </div>

                <div class="summary-card">

                    <span>Retiros</span>

                    <strong id="totalRetiros">
                        0
                    </strong>

                </div>

                <div class="summary-card">

                    <span>Servicios</span>

                    <strong id="totalServicios">
                        0
                    </strong>

                </div>

            </div>

            <!-- GRÁFICO DE BARRAS -->
            <div class="chart-box">

                <canvas id="transactionChart"></canvas>

            </div>

            <!-- VOLVER AL MENÚ -->
            <a
                href="menu.html"
                class="btn-confirm balance-button">

                Volver al menú principal

            </a>

        </main>

    </div>

    <!-- ======================================
         BIBLIOTECAS JAVASCRIPT
    ======================================= -->

    <!-- Chart.js: gráficos interactivos -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- ======================================
         FUNCIONES DE POKÉMON BANK
    ======================================= -->

    <!-- datos.js ya se cargó en el encabezado -->

    <!-- Generar gráfico desde el historial -->
    <script src="js/graficos.js"></script>

</body>

</html>
