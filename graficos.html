<!DOCTYPE html>
<html lang="es">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Pokémon Bank | Gráficos</title>

    <!-- Bootstrap 4 -->
    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap@4.6.2/dist/css/bootstrap.min.css">

    <!-- Nuestro CSS -->
    <link rel="stylesheet" href="css/operaciones.css">
</head>

<body>

    <div class="chart-container">

        <header class="operation-header">

            <a href="menu.html" class="back-link">
                ← Volver
            </a>

            <h1>Pokémon Bank</h1>

        </header>

        <main class="chart-content">

            <div class="operation-title">

                <div class="operation-symbol">
                    📊
                </div>

                <h2>Gráfico de transacciones</h2>

                <p>
                    Cantidad de movimientos realizados según su tipo.
                </p>

            </div>

            <!-- RESUMEN -->
            <div class="transaction-summary">

                <div class="summary-card">
                    <span>Depósitos</span>
                    <strong id="totalDepositos">0</strong>
                </div>

                <div class="summary-card">
                    <span>Retiros</span>
                    <strong id="totalRetiros">0</strong>
                </div>

                <div class="summary-card">
                    <span>Servicios</span>
                    <strong id="totalServicios">0</strong>
                </div>

            </div>

            <!-- GRÁFICO -->
            <div class="chart-box">

                <canvas id="transactionChart"></canvas>

            </div>

            <a href="menu.html"
                class="btn-confirm balance-button">

                Volver al menú principal

            </a>

        </main>

    </div>


    <!-- Chart.js -->
    <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>

    <!-- Datos del banco -->
    <script src="js/datos.js"></script>

    <!-- Nuestro gráfico -->
    <script src="js/graficos.js"></script>

</body>

</html>
